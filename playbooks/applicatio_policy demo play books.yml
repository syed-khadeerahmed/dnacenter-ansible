# Application Queuing Profile

- name: Application Queuing Profile Creation in Cisco Catalyst Center
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files:
    - "credentials.yml"  
  tasks:
    - name: Create a application Queuing Profile having types bandwidth and dscp
      cisco.dnac.application_policy_workflow_manager:
        dnac_host: "{{ dnac_host }}"
        dnac_username: "{{ dnac_username }}"
        dnac_password: "{{ dnac_password }}"
        dnac_verify: "{{ dnac_verify }}"
        dnac_port: "{{ dnac_port }}"
        dnac_version: "{{ dnac_version }}"
        dnac_debug: "{{ dnac_debug }}"
        dnac_log: True
        dnac_log_level: DEBUG
        config_verify: True
        dnac_api_task_timeout: 1000
        dnac_task_poll_interval: 1
        state: merged
        config:
          - application_queuing_details:
              - queuing_profile_name: "Asampleq9"
                queuing_policy_description: "sample 12234567876543q"
                # type: ["dscp", "bandwidth"]
                bandwidth_settings:
                  is_common_between_all_interface_speeds: true
                  interface_speed: "ALL"
                  bandwidth_percentages:
                      transactional_data: "5"
                      best_effort: "10"
                      voip_telephony: "15"
                      multimedia_streaming: "10"
                      real_time_interactive: "20"
                      multimedia_conferencing: "10"
                      signaling: "10"
                      scavenger: "5"
                      ops_admin_mgmt: "5"
                      broadcast_video: "2"
                      network_control: "3"
                      bulk_data: "5"
